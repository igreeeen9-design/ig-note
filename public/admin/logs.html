<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>LOG一覧 - 管理画面</title>
  <link rel="stylesheet" href="./admin.css" />
</head>
<body><div class="wrap">
  <div class="topbar"><h1>LOG一覧</h1><a class="back" href="./index.html">管理画面</a></div>
  <nav aria-label="管理コンテンツ" class="admin-tabs"><a href="./index.html">BLOG</a><a href="./logs.html" aria-current="page">LOG</a></nav>
  <p class="field-hint">日々の、記事にするほどでもないこと。</p>
  <p id="status" class="status" role="status">読み込み中…</p>
  <ul id="logs" class="post-list"></ul>
  <a class="log-new" href="./log-edit.html">＋ 新しいLOGを書く</a>
</div>
<script type="module">
  import { getToken } from './admin.js';
  import { listLogs } from './log-store.js';
  import { logExcerpt } from './log-data.js';
  const status = document.getElementById('status');
  async function init() {
    if (!getToken()) { location.replace('./index.html'); return; }
    try {
      const logs = await listLogs();
      status.textContent = logs.length ? '' : 'まだLOGがありません。書きたい日に、少しずつ。';
      for (const log of logs) {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = `./log-edit.html?path=${encodeURIComponent(log.path)}`;
        const body = document.createElement('span');
        body.className = 'post-title'; body.textContent = logExcerpt(log.data.body);
        const meta = document.createElement('span'); meta.className = 'post-meta';
        const badge = document.createElement('span');
        badge.className = `badge ${log.data.draft ? 'draft' : 'published'}`;
        badge.textContent = log.data.draft ? '下書き' : '公開中';
        meta.append(badge, document.createElement('br'), log.data.date.replaceAll('-', '.'));
        a.append(body, meta); li.append(a); document.getElementById('logs').append(li);
      }
    } catch (err) {
      status.className = 'status error';
      status.textContent = `読み込みに失敗しました。管理画面でトークン・権限を確認してください。${err.message}`;
    }
  }
  init();
</script>
</body></html>
