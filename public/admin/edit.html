<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>記事編集 - 管理画面</title>
    <link rel="stylesheet" href="./admin.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>
  </head>
  <body>
    <div class="wrap">
      <div class="topbar">
        <a class="back" href="./index.html">← 一覧</a>
        <span id="draft-indicator" class="badge draft" hidden>下書き</span>
      </div>

      <div id="loading" class="spinner">読み込み中…</div>

      <div id="editor" hidden>
        <div class="field">
          <label for="title-input">タイトル</label>
          <input id="title-input" type="text" class="title-input" placeholder="タイトルを入力" />
        </div>

        <div class="field">
          <label for="date-input">公開日</label>
          <input id="date-input" type="date" />
        </div>

        <div class="field">
          <label for="tag-input">タグ</label>
          <div id="tag-list" class="tag-chip-list"></div>
          <div class="tag-input-row">
            <input id="tag-input" type="text" placeholder="タグを入力してEnter" />
            <button type="button" class="btn" id="btn-tag-add">追加</button>
          </div>
        </div>

        <div id="edit-area">
          <div class="editor-toolbar">
            <button type="button" id="btn-heading">見出し</button>
            <button type="button" id="btn-bold">太字</button>
            <button type="button" id="btn-image">画像</button>
          </div>
          <div class="field">
            <label for="body-textarea">本文(Markdown)</label>
            <textarea id="body-textarea" class="body-textarea" placeholder="本文を書く…"></textarea>
          </div>
        </div>

        <div id="preview-area" hidden>
          <div class="preview" id="preview-content"></div>
        </div>

        <div class="field" id="image-list-section" hidden>
          <label>本文内の画像(タップしてサイズ・トリミングを調整)</label>
          <div id="image-list" class="image-list"></div>
        </div>

        <input type="file" id="file-input" accept="image/*" hidden />

        <p id="edit-status" class="status"></p>

        <div class="more-menu" id="more-menu" hidden>
          <button type="button" class="btn" id="btn-duplicate">複製</button>
          <button type="button" class="btn danger" id="btn-delete">削除</button>
        </div>
      </div>
    </div>

    <div class="crop-modal" id="crop-modal" hidden>
      <div class="crop-modal-inner">
        <div class="crop-stage" id="crop-stage">
          <img id="crop-image" alt="" />
          <div class="crop-box" id="crop-box">
            <div class="crop-handle" data-handle="nw"></div>
            <div class="crop-handle" data-handle="ne"></div>
            <div class="crop-handle" data-handle="sw"></div>
            <div class="crop-handle" data-handle="se"></div>
          </div>
        </div>
        <div class="crop-actions">
          <button type="button" class="btn" id="crop-cancel">キャンセル</button>
          <button type="button" class="btn" id="crop-reset">リセット</button>
          <button type="button" class="btn" id="crop-skip">切り抜きなしで確定</button>
          <button type="button" class="btn primary" id="crop-confirm">この範囲で切り抜く</button>
        </div>
      </div>
    </div>

    <div class="action-bar" id="action-bar" hidden>
      <div class="row">
        <button type="button" class="btn" id="btn-save-draft">下書き保存</button>
        <button type="button" class="btn" id="btn-update" hidden>更新を保存</button>
        <button type="button" class="btn" id="btn-preview-toggle">プレビュー</button>
        <button type="button" class="btn primary" id="btn-publish">公開する</button>
        <button type="button" class="btn" id="btn-unpublish" hidden>下書きに戻す</button>
      </div>
    </div>

    <script type="module">
      import {
        getPost,
        savePostFile,
        deletePostFile,
        uploadImage,
        fetchRepoImageBlob,
        parseImages,
        buildImageTag,
        replaceImageAt,
        buildPostFile,
        parseTagsValue,
        genPostPath,
        todayISO,
      } from './admin.js';

      const params = new URLSearchParams(location.search);
      const initialPath = params.get('path');

      const state = {
        path: initialPath,
        sha: null,
        originalData: {},
        draft: true,
        tags: [],
      };

      const el = (id) => document.getElementById(id);
      const loading = el('loading');
      const editor = el('editor');
      const titleInput = el('title-input');
      const dateInput = el('date-input');
      const tagInput = el('tag-input');
      const tagListEl = el('tag-list');
      const btnTagAdd = el('btn-tag-add');
      const bodyTextarea = el('body-textarea');
      const editArea = el('edit-area');
      const previewArea = el('preview-area');
      const previewContent = el('preview-content');
      const editStatus = el('edit-status');
      const actionBar = el('action-bar');
      const draftIndicator = el('draft-indicator');
      const moreMenu = el('more-menu');
      const fileInput = el('file-input');
      const imageListSection = el('image-list-section');
      const imageListEl = el('image-list');
      const cropModal = el('crop-modal');
      const cropStage = el('crop-stage');
      const cropImageEl = el('crop-image');
      const cropBoxEl = el('crop-box');
      const cropCancelBtn = el('crop-cancel');
      const cropResetBtn = el('crop-reset');
      const cropSkipBtn = el('crop-skip');
      const cropConfirmBtn = el('crop-confirm');

      const btnSaveDraft = el('btn-save-draft');
      const btnUpdate = el('btn-update');
      const btnPublish = el('btn-publish');
      const btnUnpublish = el('btn-unpublish');
      const btnPreviewToggle = el('btn-preview-toggle');
      const btnDuplicate = el('btn-duplicate');
      const btnDelete = el('btn-delete');
      const btnHeading = el('btn-heading');
      const btnBold = el('btn-bold');
      const btnImage = el('btn-image');

      let previewing = false;
      let savedCursorPos = 0;

      async function init() {
        dateInput.value = todayISO();
        if (initialPath) {
          try {
            const post = await getPost(initialPath);
            state.sha = post.sha;
            state.originalData = post.data;
            state.draft = post.data.draft === 'true';
            titleInput.value = post.data.title ? unquoteLocal(post.data.title) : '';
            dateInput.value = post.data.date || todayISO();
            state.tags = parseTagsValue(post.data.tags);
            bodyTextarea.value = post.body;
          } catch (err) {
            loading.textContent = `読み込みに失敗しました: ${err.message}`;
            return;
          }
        }
        loading.hidden = true;
        editor.hidden = false;
        actionBar.hidden = false;
        renderState();
        renderTags();
        refreshImageList();
      }

      function unquoteLocal(raw) {
        if (raw.startsWith('"') && raw.endsWith('"')) {
          try {
            return JSON.parse(raw);
          } catch {
            return raw.slice(1, -1);
          }
        }
        return raw;
      }

      function renderState() {
        draftIndicator.hidden = !state.draft;
        btnSaveDraft.hidden = !state.draft;
        btnPublish.hidden = !state.draft;
        btnUpdate.hidden = state.draft;
        btnUnpublish.hidden = state.draft;
        moreMenu.hidden = !state.path;
      }

      // ---------- タグ編集 ----------

      function renderTags() {
        tagListEl.innerHTML = '';
        state.tags.forEach((tag, i) => {
          const chip = document.createElement('span');
          chip.className = 'tag-chip';
          const label = document.createElement('span');
          label.textContent = tag;
          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.textContent = '×';
          removeBtn.setAttribute('aria-label', `「${tag}」を削除`);
          removeBtn.addEventListener('click', () => {
            state.tags.splice(i, 1);
            renderTags();
          });
          chip.append(label, removeBtn);
          tagListEl.appendChild(chip);
        });
      }

      function addTagFromInput() {
        const value = tagInput.value.trim();
        if (!value) return;
        if (!state.tags.includes(value)) {
          state.tags.push(value);
          renderTags();
        }
        tagInput.value = '';
      }

      btnTagAdd.addEventListener('click', addTagFromInput);
      tagInput.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter') return;
        e.preventDefault();
        addTagFromInput();
      });

      function setBusy(busy) {
        for (const b of [btnSaveDraft, btnUpdate, btnPublish, btnUnpublish, btnDuplicate, btnDelete]) {
          b.disabled = busy;
        }
      }

      function setStatus(msg, type = '') {
        editStatus.textContent = msg;
        editStatus.className = `status ${type}`;
        // 本文が短いとステータス表示が下部固定バーの裏に隠れてしまうため、常に見える位置までスクロールする
        if (msg) editStatus.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      function handleError(err) {
        if (err.status === 401 || err.status === 403) return 'トークンが無効か権限不足です。一覧の⚙️から登録し直してください。';
        if (err.status === 409) return '他の場所で更新されています。一覧から開き直してください。';
        return `失敗しました: ${err.message}`;
      }

      async function save({ draft, date, message }) {
        setBusy(true);
        setStatus('保存中…');
        try {
          const finalDate = date || todayISO();
          const content = buildPostFile({
            originalData: state.originalData,
            title: titleInput.value,
            draft,
            date: finalDate,
            tags: state.tags,
            body: bodyTextarea.value,
          });
          const path = state.path || genPostPath();
          const res = await savePostFile(path, content, message, state.sha || undefined);
          state.path = path;
          state.sha = res.content.sha;
          state.draft = draft;
          dateInput.value = finalDate;
          history.replaceState(null, '', `./edit.html?path=${encodeURIComponent(path)}`);
          renderState();
          setStatus(draft ? '下書き保存しました' : '公開しました', 'success');
        } catch (err) {
          setStatus(handleError(err), 'error');
        } finally {
          setBusy(false);
        }
      }

      function titleOrUntitled() {
        return titleInput.value.trim() || '(無題)';
      }

      btnSaveDraft.addEventListener('click', () => {
        save({ draft: true, date: dateInput.value, message: `下書き保存: ${titleOrUntitled()}` });
      });
      btnPublish.addEventListener('click', () => {
        save({ draft: false, date: dateInput.value, message: `公開: ${titleOrUntitled()}` });
      });
      btnUpdate.addEventListener('click', () => {
        save({ draft: false, date: dateInput.value, message: `更新: ${titleOrUntitled()}` });
      });
      btnUnpublish.addEventListener('click', () => {
        save({ draft: true, date: dateInput.value, message: `公開を取り下げ: ${titleOrUntitled()}` });
      });

      btnPreviewToggle.addEventListener('click', () => {
        previewing = !previewing;
        editArea.hidden = previewing;
        previewArea.hidden = !previewing;
        btnPreviewToggle.textContent = previewing ? '編集に戻る' : 'プレビュー';
        if (previewing) {
          const html = window.marked ? window.marked.parse(bodyTextarea.value) : escapeHtml(bodyTextarea.value);
          previewContent.innerHTML = `<h1>${escapeHtml(titleInput.value)}</h1>${html}`;
        }
      });

      btnDuplicate.addEventListener('click', async () => {
        if (!confirm('この記事を複製して、下書きとして保存しますか？')) return;
        setBusy(true);
        setStatus('複製中…');
        try {
          const content = buildPostFile({
            originalData: {},
            title: `${titleInput.value} のコピー`,
            draft: true,
            date: todayISO(),
            tags: state.tags,
            body: bodyTextarea.value,
          });
          const newPath = genPostPath();
          await savePostFile(newPath, content, `複製: ${titleOrUntitled()}`);
          location.href = `./edit.html?path=${encodeURIComponent(newPath)}`;
        } catch (err) {
          setStatus(handleError(err), 'error');
          setBusy(false);
        }
      });

      btnDelete.addEventListener('click', async () => {
        if (!confirm('この記事を削除します。元に戻せません。よろしいですか？')) return;
        setBusy(true);
        setStatus('削除中…');
        try {
          await deletePostFile(state.path, state.sha, `削除: ${titleOrUntitled()}`);
          location.href = './index.html';
        } catch (err) {
          setStatus(handleError(err), 'error');
          setBusy(false);
        }
      });

      // ツールバー: Markdown挿入
      bodyTextarea.addEventListener('keyup', () => (savedCursorPos = bodyTextarea.selectionStart));
      bodyTextarea.addEventListener('click', () => (savedCursorPos = bodyTextarea.selectionStart));

      btnHeading.addEventListener('click', () => insertAtCursor('\n## '));
      btnBold.addEventListener('click', () => wrapSelection('**', '**'));

      btnImage.addEventListener('click', () => {
        savedCursorPos = bodyTextarea.selectionStart;
        fileInput.click();
      });

      fileInput.addEventListener('change', async () => {
        const file = fileInput.files[0];
        fileInput.value = '';
        if (!file) return;
        const objectUrl = URL.createObjectURL(file);
        try {
          const result = await openCropModal(objectUrl);
          if (result.action === 'cancel') return;
          setBusy(true);
          setStatus('アップロード中…');
          const originalUrl = await uploadImage(file);
          let finalUrl = originalUrl;
          if (result.action === 'crop') {
            setStatus('トリミング画像をアップロード中…');
            finalUrl = await uploadImage(result.blob);
          }
          const tag = buildImageTag({ src: finalUrl, original: originalUrl, width: 100 });
          insertAtCursor(`\n${tag}\n`);
          setStatus('画像を挿入しました', 'success');
          refreshImageList();
        } catch (err) {
          setStatus(handleError(err), 'error');
        } finally {
          URL.revokeObjectURL(objectUrl);
          setBusy(false);
        }
      });

      // ---------- 本文内の画像一覧(サイズ変更・トリミング・元に戻す) ----------

      function refreshImageList() {
        const images = parseImages(bodyTextarea.value);
        imageListSection.hidden = images.length === 0;
        imageListEl.innerHTML = '';
        images.forEach((img, i) => {
          const card = document.createElement('div');
          card.className = 'image-card';
          const canRevert = img.original && img.original !== img.src;
          card.innerHTML = `
            <img class="image-thumb" src="${img.src}" alt="" />
            <div class="image-card-controls">
              <div class="size-buttons">
                ${[25, 50, 75, 100]
                  .map((w) => `<button type="button" class="size-btn${img.width === w ? ' active' : ''}" data-w="${w}">${w}%</button>`)
                  .join('')}
              </div>
              <div class="image-card-actions">
                <button type="button" class="btn crop-trigger">トリミング</button>
                ${canRevert ? '<button type="button" class="btn revert-trigger">元に戻す</button>' : ''}
              </div>
            </div>
          `;
          card.querySelectorAll('.size-btn').forEach((btn) => {
            btn.addEventListener('click', () => setImageWidth(i, Number(btn.dataset.w)));
          });
          card.querySelector('.crop-trigger').addEventListener('click', () => cropExistingImage(i));
          const revertBtn = card.querySelector('.revert-trigger');
          if (revertBtn) revertBtn.addEventListener('click', () => revertImage(i));
          imageListEl.appendChild(card);
        });
      }

      function setImageWidth(i, width) {
        const images = parseImages(bodyTextarea.value);
        const img = images[i];
        if (!img) return;
        const newTag = buildImageTag({ src: img.src, original: img.original, width });
        bodyTextarea.value = replaceImageAt(bodyTextarea.value, img.start, img.end, newTag);
        refreshImageList();
      }

      function revertImage(i) {
        const images = parseImages(bodyTextarea.value);
        const img = images[i];
        if (!img) return;
        const newTag = buildImageTag({ src: img.original, original: img.original, width: img.width });
        bodyTextarea.value = replaceImageAt(bodyTextarea.value, img.start, img.end, newTag);
        refreshImageList();
      }

      async function cropExistingImage(i) {
        const images = parseImages(bodyTextarea.value);
        const img = images[i];
        if (!img) return;
        setBusy(true);
        setStatus('画像を読み込み中…');
        let objectUrl;
        try {
          const blob = await fetchRepoImageBlob(img.original);
          objectUrl = URL.createObjectURL(blob);
          const result = await openCropModal(objectUrl);
          if (result.action === 'cancel') {
            setStatus('');
            return;
          }
          let newSrc = img.original;
          if (result.action === 'crop') {
            setStatus('アップロード中…');
            newSrc = await uploadImage(result.blob);
          }
          const freshImages = parseImages(bodyTextarea.value);
          const target = freshImages[i];
          const newTag = buildImageTag({ src: newSrc, original: img.original, width: target.width });
          bodyTextarea.value = replaceImageAt(bodyTextarea.value, target.start, target.end, newTag);
          setStatus(result.action === 'crop' ? 'トリミングしました' : '元の画像にしました', 'success');
          refreshImageList();
        } catch (err) {
          setStatus(handleError(err), 'error');
        } finally {
          if (objectUrl) URL.revokeObjectURL(objectUrl);
          setBusy(false);
        }
      }

      // 手動で本文を編集した場合(画像タグの追加・削除など)も一覧に反映する
      bodyTextarea.addEventListener('blur', refreshImageList);

      // ---------- トリミングモーダル ----------
      // マウス・タッチどちらもPointer Eventsで統一して扱う

      let cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
      let dragMode = null;
      let dragStart = null;

      function clamp(v, min, max) {
        return Math.min(max, Math.max(min, v));
      }

      function fracFromEvent(e) {
        const rect = cropStage.getBoundingClientRect();
        return {
          fx: clamp((e.clientX - rect.left) / rect.width, 0, 1),
          fy: clamp((e.clientY - rect.top) / rect.height, 0, 1),
        };
      }

      function renderCropBox() {
        cropBoxEl.style.left = `${cropRect.x0 * 100}%`;
        cropBoxEl.style.top = `${cropRect.y0 * 100}%`;
        cropBoxEl.style.width = `${(cropRect.x1 - cropRect.x0) * 100}%`;
        cropBoxEl.style.height = `${(cropRect.y1 - cropRect.y0) * 100}%`;
      }

      function startDrag(mode) {
        return (e) => {
          e.preventDefault();
          // ハンドルはcrop-boxの内側にあるため、stopPropagationしないと
          // pointerdownがcrop-box側の'move'ハンドラにも伝播し、リサイズのはずが移動になってしまう
          e.stopPropagation();
          dragMode = mode;
          dragStart = { ...fracFromEvent(e), box: { ...cropRect } };
          e.target.setPointerCapture?.(e.pointerId);
        };
      }

      function onCropPointerMove(e) {
        if (!dragMode) return;
        const { fx, fy } = fracFromEvent(e);
        const dx = fx - dragStart.fx;
        const dy = fy - dragStart.fy;
        const b = dragStart.box;
        const min = 0.08;
        if (dragMode === 'move') {
          const w = b.x1 - b.x0;
          const h = b.y1 - b.y0;
          const x0 = clamp(b.x0 + dx, 0, 1 - w);
          const y0 = clamp(b.y0 + dy, 0, 1 - h);
          cropRect = { x0, y0, x1: x0 + w, y1: y0 + h };
        } else if (dragMode === 'nw') {
          cropRect.x0 = clamp(Math.min(b.x0 + dx, b.x1 - min), 0, 1);
          cropRect.y0 = clamp(Math.min(b.y0 + dy, b.y1 - min), 0, 1);
        } else if (dragMode === 'ne') {
          cropRect.x1 = clamp(Math.max(b.x1 + dx, b.x0 + min), 0, 1);
          cropRect.y0 = clamp(Math.min(b.y0 + dy, b.y1 - min), 0, 1);
        } else if (dragMode === 'sw') {
          cropRect.x0 = clamp(Math.min(b.x0 + dx, b.x1 - min), 0, 1);
          cropRect.y1 = clamp(Math.max(b.y1 + dy, b.y0 + min), 0, 1);
        } else if (dragMode === 'se') {
          cropRect.x1 = clamp(Math.max(b.x1 + dx, b.x0 + min), 0, 1);
          cropRect.y1 = clamp(Math.max(b.y1 + dy, b.y0 + min), 0, 1);
        }
        renderCropBox();
      }

      function onCropPointerUp() {
        dragMode = null;
      }

      cropBoxEl.addEventListener('pointerdown', startDrag('move'));
      cropStage.querySelectorAll('.crop-handle').forEach((handle) => {
        handle.addEventListener('pointerdown', startDrag(handle.dataset.handle));
      });
      cropStage.addEventListener('pointermove', onCropPointerMove);
      cropStage.addEventListener('pointerup', onCropPointerUp);
      cropStage.addEventListener('pointercancel', onCropPointerUp);

      function openCropModal(sourceUrl) {
        return new Promise((resolve) => {
          cropModal.hidden = false;
          cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };

          function cleanup(result) {
            cropModal.hidden = true;
            cropImageEl.onload = null;
            cropCancelBtn.onclick = null;
            cropResetBtn.onclick = null;
            cropSkipBtn.onclick = null;
            cropConfirmBtn.onclick = null;
            resolve(result);
          }

          cropImageEl.onload = () => renderCropBox();
          cropImageEl.src = sourceUrl;

          cropCancelBtn.onclick = () => cleanup({ action: 'cancel' });
          cropResetBtn.onclick = () => {
            cropRect = { x0: 0, y0: 0, x1: 1, y1: 1 };
            renderCropBox();
          };
          cropSkipBtn.onclick = () => cleanup({ action: 'skip' });
          cropConfirmBtn.onclick = async () => {
            const blob = await buildCroppedBlob();
            cleanup({ action: 'crop', blob });
          };
        });
      }

      function buildCroppedBlob() {
        const img = cropImageEl;
        const sx = Math.round(cropRect.x0 * img.naturalWidth);
        const sy = Math.round(cropRect.y0 * img.naturalHeight);
        const sw = Math.round((cropRect.x1 - cropRect.x0) * img.naturalWidth);
        const sh = Math.round((cropRect.y1 - cropRect.y0) * img.naturalHeight);
        const canvas = document.createElement('canvas');
        canvas.width = sw;
        canvas.height = sh;
        canvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
        return new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.9));
      }

      function insertAtCursor(text) {
        const pos = savedCursorPos ?? bodyTextarea.value.length;
        const value = bodyTextarea.value;
        bodyTextarea.value = value.slice(0, pos) + text + value.slice(pos);
        const newPos = pos + text.length;
        bodyTextarea.focus();
        bodyTextarea.setSelectionRange(newPos, newPos);
        savedCursorPos = newPos;
      }

      function wrapSelection(before, after) {
        const start = bodyTextarea.selectionStart;
        const end = bodyTextarea.selectionEnd;
        const value = bodyTextarea.value;
        const selected = value.slice(start, end) || '文字';
        bodyTextarea.value = value.slice(0, start) + before + selected + after + value.slice(end);
        const newStart = start + before.length;
        const newEnd = newStart + selected.length;
        bodyTextarea.focus();
        bodyTextarea.setSelectionRange(newStart, newEnd);
        savedCursorPos = newEnd;
      }

      function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      }

      init();
    </script>
  </body>
</html>
